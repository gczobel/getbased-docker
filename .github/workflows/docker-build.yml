name: Build and publish image

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly rebuild, so a floating base image and upstream `main` branch
    # both get picked up even without any change to this repo.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          no-cache: true
          tags: ghcr.io/${{ github.repository_owner }}/getbased-docker:latest
